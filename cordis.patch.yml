# Teammate model picker — Host row.
#
# The row id is also the settings namespace the Client half addresses, so do not
# rename `id` alone: scripts/check-identity.mjs asserts all five places agree.
# `overrides` is the durable per-teammate override table; DESIGN.md explains why
# it lives in the user's config layer instead of the session log.
- insert:
    - id: teammate-model-picker
      name: '@wufeng0105/dsh-teammate-model-picker'
      config:
        showPicker: true
        overrides: []
